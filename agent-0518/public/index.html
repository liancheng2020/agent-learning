<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frontend Review Agent Pro</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <h1>Frontend Review Agent Pro</h1>
          <p>Structured findings, patch plan, trace, and eval-ready output.</p>
        </div>
        <button id="rerun">Run Review</button>
      </header>
      <section id="metrics" class="metrics"></section>
      <section class="grid">
        <div class="panel"><h2>Findings</h2><div id="findings"></div></div>
        <div class="panel"><h2>Patch Plan</h2><div id="plan"></div></div>
      </section>
      <section class="panel"><h2>Patch</h2><pre id="patch"></pre></section>
      <section class="panel"><h2>Trace</h2><div id="trace"></div></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
